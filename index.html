<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>🌺 माँ ना गरबा 🌺</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,
    "Noto Sans Devanagari",
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #fff4f4,
        #ffe0d5,
        #fff
    );

    color:#333;
    min-height:100vh;
}

.header{

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

    color:white;

    text-align:center;

    padding:22px 12px;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,.25);
}

.header h1{

    font-size:30px;

    margin-bottom:7px;
}

.header p{

    font-size:15px;

    line-height:1.6;
}

.container{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:15px;
}

.statusBox{

    background:white;

    border-radius:14px;

    padding:14px;

    margin-bottom:15px;

    text-align:center;

    box-shadow:
    0 2px 10px
    rgba(0,0,0,.10);
}

.status{

    font-weight:bold;

    color:#555;

    line-height:1.6;
}

.buttons{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:10px;
}

button{

    border:0;

    border-radius:22px;

    padding:10px 18px;

    color:white;

    background:#8e24aa;

    font-weight:bold;

    cursor:pointer;
}

button:active{

    transform:scale(.96);
}

#refreshBtn{

    background:#ff6a00;
}

.count{

    margin-top:8px;

    font-size:14px;

    color:#666;
}

.gallery{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(
            220px,
            1fr
        )
    );

    gap:14px;
}

.card{

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);
}

.card img,
.card video{

    width:100%;

    height:240px;

    display:block;

    object-fit:cover;

    background:#111;
}

.cardInfo{

    padding:10px;

    text-align:center;
}

.cardTitle{

    font-weight:bold;

    font-size:14px;

    color:#555;

    word-break:break-word;
}

.empty{

    background:white;

    border-radius:15px;

    padding:45px 15px;

    text-align:center;

    color:#777;

    box-shadow:
    0 2px 10px
    rgba(0,0,0,.1);
}

.loading{

    color:#8e24aa;

    font-weight:bold;
}

.error{

    color:#d32f2f;

    font-weight:bold;

    word-break:break-word;
}

.footer{

    text-align:center;

    padding:25px 10px;

    color:#777;

    font-size:13px;
}

@media(max-width:600px){

    .header h1{

        font-size:25px;
    }

    .gallery{

        grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

        gap:10px;
    }

    .card img,
    .card video{

        height:180px;
    }

    .container{

        padding:10px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <h1>
        🌺 माँ ना गरबा 🌺
    </h1>

    <p>
        रेडवुड पार्क प्रीमियम<br>
        नव गरबा मंडल • गरबा उत्सव 2026
    </p>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <div class="statusBox">

        <div
            id="status"
            class="status">

            ⏳ Online Gallery लोड हो रही है...

        </div>


        <div class="buttons">

            <button
                id="refreshBtn">

                🔄 Gallery Refresh

            </button>

        </div>


        <div
            id="count"
            class="count">

            0 Media

        </div>

    </div>


    <!-- =================================================
         GALLERY
    ================================================== -->

    <div
        id="gallery"
        class="gallery">

    </div>


</main>


<footer class="footer">

    🌺 माँ ना गरबा 🌺<br>

    Redwood Park Premium • नव गरबा मंडल 2026<br>

    Editor: Sanjay Patidar

</footer>


<script>

/* =========================================================
   SUPABASE SETTINGS
========================================================= */

const SUPABASE_URL =
    "https://pwdxbgjsduqqfsejednc.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_ccHBLTW0W4qBiZZn0qadXw_68bSUBnu";


const TABLE_NAME =
    "garba_media";


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );


const galleryEl =
    document.getElementById(
        "gallery"
    );


const countEl =
    document.getElementById(
        "count"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function getHeaders(){

    return {

        "apikey":
            SUPABASE_ANON_KEY,

        "Authorization":
            "Bearer " +
            SUPABASE_ANON_KEY,

        "Content-Type":
            "application/json"

    };

}


/* =========================================================
   LOAD GALLERY
========================================================= */

async function loadGallery(){

    statusEl.className =
        "status loading";

    statusEl.textContent =
        "⏳ Supabase से Gallery लोड हो रही है...";


    galleryEl.innerHTML = "";


    countEl.textContent =
        "0 Media";


    try{

        /*
         * सीधे garba_media table से
         * सभी records पढ़ना
         */

        const url =
            SUPABASE_URL +
            "/rest/v1/" +
            TABLE_NAME +
            "?select=id,title,media_url,media_type,created_at" +
            "&order=created_at.asc";


        const response =
            await fetch(
                url,
                {

                    method:"GET",

                    headers:
                        getHeaders()

                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            throw new Error(
                "Supabase Error " +
                response.status +
                ": " +
                errorText
            );

        }


        const data =
            await response.json();


        if(
            !Array.isArray(data) ||
            data.length === 0
        ){

            statusEl.className =
                "status";


            statusEl.textContent =
                "📭 अभी Online Gallery में कोई फोटो या वीडियो नहीं है।";


            countEl.textContent =
                "0 Media";


            galleryEl.innerHTML = `

                <div class="empty">

                    📸🎥<br><br>

                    अभी कोई फोटो या वीडियो उपलब्ध नहीं है।<br>

                    APK से Media Upload करने के बाद<br>

                    यहाँ दिखाई देगा।

                </div>

            `;

            return;

        }


        /*
         * Gallery बनाना
         */

        data.forEach(
            function(item){

                createMediaCard(
                    item
                );

            }
        );


        statusEl.className =
            "status";


        statusEl.textContent =
            "✅ Online Gallery तैयार है।";


        countEl.textContent =
            data.length +
            " Media";


    }
    catch(error){

        console.error(
            "Gallery Error:",
            error
        );


        statusEl.className =
            "status error";


        statusEl.textContent =
            "❌ Gallery लोड नहीं हो सकी।";


        galleryEl.innerHTML = `

            <div class="empty error">

                ❌ Supabase से Gallery लोड नहीं हुई।<br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

                <br><br>

                कृपया Supabase में
                <b>garba_media</b>
                table की SELECT permission/RLS policy जाँचें।

            </div>

        `;

    }

}


/* =========================================================
   CREATE MEDIA CARD
========================================================= */

function createMediaCard(item){

    if(
        !item ||
        !item.media_url
    ){

        return;

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    let mediaElement;


    const type =
        String(
            item.media_type || ""
        ).toLowerCase();


    /*
     * VIDEO
     */

    if(
        type === "video" ||
        isVideoUrl(
            item.media_url
        )
    ){

        mediaElement =
            document.createElement(
                "video"
            );


        mediaElement.src =
            item.media_url;


        mediaElement.controls =
            true;


        mediaElement.playsInline =
            true;


        mediaElement.preload =
            "metadata";

    }


    /*
     * PHOTO
     */

    else{

        mediaElement =
            document.createElement(
                "img"
            );


        mediaElement.src =
            item.media_url;


        mediaElement.alt =
            item.title ||
            "माँ ना गरबा";


        mediaElement.loading =
            "lazy";

    }


    mediaElement.onerror =
        function(){

            mediaElement.style.display =
                "none";

        };


    card.appendChild(
        mediaElement
    );


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "cardInfo";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "cardTitle";


    title.textContent =
        item.title ||
        (
            type === "video"
            ? "🎥 Garba Video"
            : "📸 Garba Photo"
        );


    info.appendChild(
        title
    );


    card.appendChild(
        info
    );


    galleryEl.appendChild(
        card
    );

}


/* =========================================================
   VIDEO URL CHECK
========================================================= */

function isVideoUrl(url){

    const cleanUrl =
        String(url || "")
            .split("?")[0]
            .toLowerCase();


    return (
        cleanUrl.endsWith(".mp4") ||
        cleanUrl.endsWith(".webm") ||
        cleanUrl.endsWith(".mov") ||
        cleanUrl.endsWith(".m4v")
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   REFRESH
========================================================= */

refreshBtn.onclick =
    function(){

        loadGallery();

    };


/* =========================================================
   START
========================================================= */

loadGallery();


</script>

</body>

</html>
