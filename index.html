<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#dd2476">

<title>🌺 माँ ना गरबा — Online Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: linear-gradient(135deg, #fff4f4, #ffe0d5, #fff);
    color: #333;
    min-height: 100vh;
}

.header {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    color: white;
    text-align: center;
    padding: 24px 12px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.header p {
    line-height: 1.8;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.statusBox {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
    text-align: center;
    box-shadow: 0 2px 10px #0001;
}

#status {
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.loading {
    color: #8e24aa;
}

.error {
    color: #d32f2f;
}

button {
    border: 0;
    border-radius: 22px;
    padding: 11px 18px;
    color: white;
    background: #8e24aa;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

#refreshBtn {
    margin-top: 10px;
    background: #ff6a00;
}

#count {
    margin-top: 10px;
    color: #666;
}

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.filters button {
    background: #6a1b9a;
}

.filters button.active {
    background: #e65100;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 14px;
}

.card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    min-width: 0;
    box-shadow: 0 3px 12px #0002;
}

.card img,
.card video {
    width: 100%;
    height: 240px;
    display: block;
    object-fit: contain;
    background: #111;
}

.cardInfo {
    padding: 12px;
    text-align: center;
}

.cardTitle {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.cardDate {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
}

.mediaError {
    padding: 12px;
    text-align: center;
    color: #b71c1c;
    background: #fff0f0;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.empty {
    grid-column: 1 / -1;
    background: white;
    border-radius: 15px;
    padding: 35px 15px;
    text-align: center;
    color: #777;
    line-height: 1.9;
}

.footer {
    text-align: center;
    padding: 25px 10px;
    color: #777;
    font-size: 13px;
    line-height: 1.9;
}

@media(max-width: 600px) {
    .header h1 {
        font-size: 24px;
    }

    .container {
        padding: 10px;
    }

    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .card img,
    .card video {
        height: 180px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🌺 माँ ना गरबा 🌺</h1>

    <p>
        रेडवुड पार्क प्रीमियम<br>
        नव गरबा मंडल • गरबा उत्सव 2026
    </p>
</header>

<main class="container">

    <section class="statusBox">

        <div id="status" class="loading">
            ⏳ ऑनलाइन गैलरी लोड हो रही है...
        </div>

        <button id="refreshBtn" type="button">
            🔄 Gallery Refresh
        </button>

        <div id="count">0 Media</div>

    </section>

    <nav class="filters">
        <button class="active" data-filter="all">
            📂 सभी
        </button>

        <button data-filter="photo">
            📸 फोटो
        </button>

        <button data-filter="video">
            🎬 वीडियो
        </button>
    </nav>

    <section id="gallery" class="gallery"></section>

</main>

<footer class="footer">
    🌺 माँ ना गरबा 🌺<br>
    रेडवुड पार्क प्रीमियम<br>
    नव गरबा मंडल • 2026<br>
    Editor: Sanjay Patidar
</footer>

<script>
"use strict";

/* ======================================
   SUPABASE SETTINGS
====================================== */

const SUPABASE_URL =
    "https://pwdxbgjsduqqfsejednc.supabase.co";

/*
  यहाँ अपनी पूरी Supabase Publishable Key रखें।
  Secret या service_role key इस्तेमाल न करें।
*/

const SUPABASE_KEY =
    "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const TABLE_NAME = "garba_media";

/* ======================================
   ELEMENTS
====================================== */

const statusEl = document.getElementById("status");
const galleryEl = document.getElementById("gallery");
const countEl = document.getElementById("count");
const refreshBtn = document.getElementById("refreshBtn");

const filterButtons =
    document.querySelectorAll("[data-filter]");

let allMedia = [];
let currentFilter = "all";
let loading = false;

/* ======================================
   STATUS
====================================== */

function setStatus(message, type = "") {
    statusEl.className = type;
    statusEl.textContent = message;
}

/* ======================================
   VIDEO TYPE
====================================== */

function isVideo(item) {
    const type = String(
        item.media_type || ""
    ).toLowerCase();

    const url = String(
        item.media_url || ""
    ).split("?")[0].toLowerCase();

    if (
        ["video", "videos", "movie", "mp4", "webm"]
            .includes(type)
    ) {
        return true;
    }

    return /\.(mp4|webm|m4v|mov|ogv)$/.test(url);
}

/* ======================================
   LOAD ONLINE MEDIA
====================================== */

async function loadGallery() {

    if (loading) return;

    if (
        !SUPABASE_KEY ||
        SUPABASE_KEY.includes("PASTE_")
    ) {
        setStatus(
            "❌ gallery.html में Supabase Publishable Key भरें।",
            "error"
        );
        return;
    }

    loading = true;
    refreshBtn.disabled = true;

    setStatus(
        "⏳ Supabase से फोटो और वीडियो लोड हो रहे हैं...",
        "loading"
    );

    try {

        const endpoint =
            SUPABASE_URL +
            "/rest/v1/" +
            TABLE_NAME +
            "?select=id,title,media_url,media_type,created_at" +
            "&order=created_at.desc";

        const response = await fetch(endpoint, {
            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        });

        if (!response.ok) {
            throw new Error(
                "Supabase HTTP " +
                response.status +
                ": " +
                await response.text()
            );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("मीडिया सूची सही नहीं है।");
        }

        /*
          एक ही URL वाली डुप्लिकेट फाइलें न दिखाएँ।
        */

        const seen = new Set();

        allMedia = data.filter(item => {

            if (!item.media_url) return false;

            const url = String(item.media_url).trim();

            if (!url || seen.has(url)) return false;

            seen.add(url);

            return true;
        });

        renderGallery();

        setStatus(
            allMedia.length
                ? "✅ ऑनलाइन गैलरी तैयार है।"
                : "📭 अभी ऑनलाइन गैलरी में कोई मीडिया नहीं मिला।"
        );

    } catch (error) {

        console.error("Gallery error:", error);

        setStatus(
            "❌ गैलरी लोड नहीं हुई: " + error.message,
            "error"
        );

        galleryEl.innerHTML = `
            <div class="empty">
                गैलरी लोड नहीं हो सकी।<br><br>
                Supabase URL, टेबल और SELECT permissions जाँचें।
            </div>
        `;

        countEl.textContent = "0 Media";

    } finally {

        loading = false;
        refreshBtn.disabled = false;

    }
}

/* ======================================
   RENDER GALLERY
====================================== */

function renderGallery() {

    galleryEl.replaceChildren();

    const visible = allMedia.filter(item => {

        if (currentFilter === "all") return true;

        return currentFilter === "video"
            ? isVideo(item)
            : !isVideo(item);
    });

    countEl.textContent =
        visible.length + " Media";

    if (!visible.length) {

        const empty = document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "इस श्रेणी में अभी कोई फोटो या वीडियो नहीं है।";

        galleryEl.appendChild(empty);

        return;
    }

    const fragment = document.createDocumentFragment();

    visible.forEach(item => {
        fragment.appendChild(createCard(item));
    });

    galleryEl.appendChild(fragment);
}

/* ======================================
   CREATE MEDIA CARD
====================================== */

function createCard(item) {

    const card = document.createElement("article");

    card.className = "card";

    const url = String(item.media_url || "").trim();

    const videoFile = isVideo(item);

    let media;

    if (videoFile) {

        media = document.createElement("video");

        media.controls = true;
        media.playsInline = true;
        media.preload = "metadata";

        media.setAttribute("playsinline", "");
        media.setAttribute("webkit-playsinline", "");

        /*
          Browser अपने आप सही वीडियो codec का समर्थन
          नहीं कर सकता। उपयोगकर्ता Play दबाकर जाँच सकता है।
        */

        media.src = url;

        media.addEventListener("error", () => {

            showError(
                card,
                "वीडियो नहीं चल सका। वीडियो फॉर्मेट या सार्वजनिक URL जाँचें।"
            );

        }, { once: true });

        media.addEventListener("loadedmetadata", () => {

            if (
                !Number.isFinite(media.duration) ||
                media.duration <= 0
            ) {
                showError(
                    card,
                    "वीडियो की अवधि नहीं मिली। फाइल दोबारा जाँचें।"
                );
            }

        }, { once: true });

    } else {

        media = document.createElement("img");

        media.src = url;
        media.alt = item.title || "माँ ना गरबा";
        media.loading = "lazy";
        media.decoding = "async";

        media.addEventListener("error", () => {

            showError(
                card,
                "फोटो लोड नहीं हुई। सार्वजनिक URL जाँचें।"
            );

        }, { once: true });

    }

    card.appendChild(media);

    const info = document.createElement("div");

    info.className = "cardInfo";

    const title = document.createElement("div");

    title.className = "cardTitle";

    title.textContent =
        item.title ||
        (videoFile ? "🎬 गरबा वीडियो" : "📸 गरबा फोटो");

    info.appendChild(title);

    if (item.created_at) {

        const date = new Date(item.created_at);

        if (!Number.isNaN(date.getTime())) {

            const dateEl = document.createElement("div");

            dateEl.className = "cardDate";

            dateEl.textContent =
                date.toLocaleDateString("hi-IN");

            info.appendChild(dateEl);
        }
    }

    card.appendChild(info);

    return card;
}

/* ======================================
   MEDIA ERROR
====================================== */

function showError(card, message) {

    if (card.querySelector(".mediaError")) return;

    const errorBox = document.createElement("div");

    errorBox.className = "mediaError";

    errorBox.textContent = message;

    card.appendChild(errorBox);
}

/* ======================================
   FILTER BUTTONS
====================================== */

filterButtons.forEach(button => {

    button.addEventListener("click", () => {

        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
            item.classList.toggle(
                "active",
                item === button
            );
        });

        renderGallery();

    });

});

/* ======================================
   REFRESH
====================================== */

refreshBtn.addEventListener("click", loadGallery);

/* ======================================
   START
====================================== */

loadGallery();

</script>

</body>
</html>
